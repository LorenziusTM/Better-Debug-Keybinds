plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
	id 'com.diffplug.spotless' version '7.2.1'
}

def remapMinecraft = project.minecraft_version.startsWith("1.")
apply plugin: remapMinecraft ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
def clientApiProfile
if (project.minecraft_version == "1.21.11") {
	clientApiProfile = "1.21"
} else if (project.minecraft_version in ["26.1", "26.2", "26.3"]) {
	clientApiProfile = project.minecraft_version
} else {
	throw new GradleException(
			"No client API profile is configured for Minecraft ${project.minecraft_version}")
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"betterdebugkeybinds" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.client.java.srcDir "src/client/java-${clientApiProfile}"

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (remapMinecraft) {
		mappings loom.officialMojangMappings()
	}
	def modDependencyConfiguration = remapMinecraft ? "modImplementation" : "implementation"
	add(modDependencyConfiguration, "net.fabricmc:fabric-loader:${project.loader_version}")

	// Fabric API. This is technically optional, but you probably want it anyway.
	add(
			modDependencyConfiguration,
			"net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
}

spotless {
	java {
		googleJavaFormat('1.28.0').aosp()
		leadingSpacesToTabs()
	}
}

def minecraftVersion = project.minecraft_version
def javaVersion = project.java_version

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand(
				"version": version,
				"minecraft_version": minecraftVersion,
				"java_version": javaVersion)
	}
}

tasks.named("processClientResources") {
	inputs.property "java_version", javaVersion

	filesMatching("betterdebugkeybinds.client.mixins.json") {
		expand "java_version": javaVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version.toInteger()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
