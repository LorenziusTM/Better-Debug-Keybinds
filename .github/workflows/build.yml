# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.3'
            loader: '0.20.1'
            fabric_api: '0.165.0+26.3'
            java: '25'
            gradle_java: '25'
          - minecraft: '26.2'
            loader: '0.20.1'
            fabric_api: '0.161.0+26.2'
            java: '25'
            gradle_java: '25'
          - minecraft: '26.1'
            loader: '0.20.1'
            fabric_api: '0.145.1+26.1'
            java: '25'
            gradle_java: '25'
          - minecraft: '1.21.11'
            loader: '0.20.1'
            fabric_api: '0.141.6+1.21.11'
            java: '21'
            gradle_java: '25'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.gradle_java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check formatting
        run: ./gradlew spotlessCheck
      - name: build
        run: >-
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pjava_version=${{ matrix.java }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-Minecraft-${{ matrix.minecraft }}
          path: build/libs/
