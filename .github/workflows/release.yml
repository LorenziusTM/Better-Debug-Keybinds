name: Release

on:
  push:
    tags:
      - 'betterdebugkeybinds-v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.3'
            loader: '0.20.1'
            fabric_api: '0.165.0+26.3'
            java: '25'
            gradle_java: '25'
          - minecraft: '26.2'
            loader: '0.20.1'
            fabric_api: '0.161.0+26.2'
            java: '25'
            gradle_java: '25'
          - minecraft: '26.1'
            loader: '0.20.1'
            fabric_api: '0.145.1+26.1'
            java: '25'
            gradle_java: '25'
          - minecraft: '1.21.11'
            loader: '0.20.1'
            fabric_api: '0.141.6+1.21.11'
            java: '21'
            gradle_java: '25'

    steps:
      - name: Checkout repository
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.gradle_java }}

      - name: Set up Gradle
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        run: chmod +x ./gradlew

      - name: Determine release version
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        id: release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#betterdebugkeybinds-v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Project version: $version"

      - name: Check formatting
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        run: ./gradlew spotlessCheck

      - name: Build mod
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./gradlew build
          "-Pversion=$RELEASE_VERSION"
          "-Pminecraft_version=${{ matrix.minecraft }}"
          "-Ploader_version=${{ matrix.loader }}"
          "-Pfabric_api_version=${{ matrix.fabric_api }}"
          "-Pjava_version=${{ matrix.java }}"

      - name: Prepare release JAR
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -name "betterdebugkeybinds-${RELEASE_VERSION}.jar" \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" "release/${RELEASE_TAG}.jar"

      - name: Publish GitHub Release
        if: contains(github.ref_name, format('-v{0}-', matrix.minecraft))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Better Debug Keybinds for Minecraft ${{ matrix.minecraft }} (${{ steps.release.outputs.version }})
          generate_release_notes: true
          files: release/*.jar
